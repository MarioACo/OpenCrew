# OpenCrew manages its own contributor workflow as a public dogfood example.
# The action only inspects GitHub metadata; it never checks out PR code.
name: OpenCrew

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  opencrew:
    runs-on: ubuntu-latest
    steps:
      - uses: MarioACo/OpenCrew@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
